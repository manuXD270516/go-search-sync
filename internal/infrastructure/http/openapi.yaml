openapi: 3.0.3
info:
  title: go-search-sync — Catálogo Farmacéutico
  version: 1.0.0
  description: |
    API de búsqueda de medicamentos y disponibilidad en farmacias.

    Los datos viven en PostgreSQL como fuente de verdad y se replican a
    OpenSearch mediante Kafka Connect (CDC con Debezium). Esta API consulta el
    índice, que está optimizado para búsqueda con tolerancia a errores de tipeo
    y sinónimos entre nombre comercial y principio activo.
servers:
  - url: http://localhost:8082
    description: Entorno local
tags:
  - name: Búsqueda
  - name: Catálogo
components:
  schemas:
    Medicine:
      type: object
      properties:
        id: { type: string, example: med_001 }
        name: { type: string, example: Panadol }
        active_ingredient: { type: string, example: paracetamol }
        form: { type: string, example: comprimido }
        strength: { type: string, example: 500 mg }
        laboratory: { type: string }
        requires_rx: { type: boolean }
    Availability:
      type: object
      properties:
        medicine_id: { type: string }
        pharmacy: { type: string, example: Farmacia Central }
        city: { type: string, example: Santa Cruz }
        stock: { type: integer, example: 12 }
        price_cents: { type: integer, format: int64, example: 2500 }
        currency: { type: string, example: BOB }
    SearchResult:
      type: object
      properties:
        total: { type: integer, format: int64 }
        took_ms: { type: integer, format: int64 }
        hits:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              score: { type: number, format: float }
              source: { $ref: '#/components/schemas/Medicine' }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
paths:
  /v1/medicines/search:
    get:
      tags: [Búsqueda]
      summary: Busca medicamentos
      description: |
        Búsqueda con tolerancia a errores de tipeo. El nombre comercial pesa más
        que el resto de campos, y buscar por principio activo encuentra las
        marcas que lo contienen. Las respuestas se cachean brevemente.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: paracetamol }
        - { name: city, in: query, schema: { type: string }, example: Santa Cruz }
        - { name: in_stock, in: query, schema: { type: boolean } }
        - { name: requires_rx, in: query, schema: { type: boolean } }
        - { name: from, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Resultados
          headers:
            X-Cache:
              schema: { type: string, enum: [hit, miss] }
              description: Indica si la respuesta salió de la caché
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/medicines/suggest:
    get:
      tags: [Búsqueda]
      summary: Autocompletado por prefijo
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 }, example: para }
        - { name: size, in: query, schema: { type: integer, default: 10, maximum: 20 } }
      responses:
        '200':
          description: Sugerencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/medicines/{id}:
    get:
      tags: [Catálogo]
      summary: Ficha del medicamento y dónde conseguirlo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: in_stock, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Ficha con disponibilidad
          content:
            application/json:
              schema:
                type: object
                properties:
                  medicine: { $ref: '#/components/schemas/Medicine' }
                  availability:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }
        '404': { $ref: '#/components/responses/Problem' }
  /healthz:
    get: { summary: Liveness, responses: { '200': { description: Vivo } } }
  /readyz:
    get:
      summary: Readiness (verifica el motor de búsqueda)
      responses:
        '200': { description: Listo }
        '503': { $ref: '#/components/responses/Problem' }
